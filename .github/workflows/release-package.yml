name: Build & publish Arch package

# Reusable workflow: project repos call it with `uses:`.
# It builds the project's PKGBUILD, attaches the .pkg.tar.zst to the release and
# notifies illegalstudio/pacman, which updates the database and GitHub Pages.
#
# See docs/example-project.yml for how to call it.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the package to"
        required: true
        type: string
      pkgbuild-dir:
        description: "Directory containing the PKGBUILD"
        required: false
        type: string
        default: "."
      build-aarch64:
        description: "Also build on an ARM64 runner (only for arch-specific packages; an arch=any package needs a single build)"
        required: false
        type: boolean
        default: false
      aarch64-image:
        description: "Container image used for the ARM64 build (Arch Linux ARM, community-maintained)"
        required: false
        type: string
        default: "menci/archlinuxarm:base-devel"
      pacman-repo:
        description: "Pacman repository to update"
        required: false
        type: string
        default: "illegalstudio/pacman"
    secrets:
      PACMAN_DISPATCH_TOKEN:
        description: "PAT with contents:write on the pacman repository"
        required: true

jobs:
  # The matrix has to be data, not an expression: an ARM runner is only added
  # when the caller asks for it.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          ARM: ${{ inputs.build-aarch64 }}
          ARM_IMAGE: ${{ inputs.aarch64-image }}
        run: |
          x86='{"runner":"ubuntu-latest","image":"archlinux:base-devel"}'
          if [ "$ARM" = "true" ]; then
            arm="{\"runner\":\"ubuntu-24.04-arm\",\"image\":\"$ARM_IMAGE\"}"
            echo "include=[$x86,$arm]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$x86]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git github-cli sudo

      - uses: actions/checkout@v4

      - name: Build the package
        working-directory: ${{ inputs.pkgbuild-dir }}
        run: |
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild

      - name: Attach the package to the release
        working-directory: ${{ inputs.pkgbuild-dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "${{ inputs.tag }}" *.pkg.tar.zst --clobber

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify the pacman repository
        env:
          GH_TOKEN: ${{ secrets.PACMAN_DISPATCH_TOKEN }}
        run: |
          gh api "repos/${{ inputs.pacman-repo }}/dispatches" \
            -f event_type=publish \
            -f "client_payload[repo]=${{ github.repository }}"
