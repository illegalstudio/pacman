name: Deploy Pages

# Deploys hand-made changes (README, index.html, packages committed directly).
# Automatic syncs deploy on their own, from sync.yml.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "packages.json"
      - "x86_64/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          mkdir -p _site
          cp -r x86_64 _site/
          cp index.html _site/
          cp packages.json _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
